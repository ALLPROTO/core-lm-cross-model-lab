name: Read-only repository secret scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Worktree and reachable history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Fetch and check out the exact source without log disclosure
        shell: bash
        env:
          CORELM_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CORELM_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$CORELM_CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [[ ! "$CORELM_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'checkout identity is invalid' >&2
            exit 1
          fi
          if ! git init --quiet . 2>/dev/null; then
            echo 'repository initialization failed closed' >&2
            exit 1
          fi
          if ! git remote add origin \
            "https://github.com/${CORELM_REPOSITORY}.git" 2>/dev/null; then
            echo 'public origin configuration failed closed' >&2
            exit 1
          fi
          if ! git -c http.extraHeader= fetch --quiet --no-tags --depth=1 \
            origin "$CORELM_CHECKOUT_SHA" 2>/dev/null; then
            echo 'exact commit fetch failed closed' >&2
            exit 1
          fi
          if ! git checkout --quiet --detach "$CORELM_CHECKOUT_SHA" \
            2>/dev/null; then
            echo 'exact commit checkout failed closed' >&2
            exit 1
          fi

      - name: Fetch every public branch and tag
        shell: bash
        env:
          CORELM_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if test -f "$(git rev-parse --git-path shallow)"; then
            if ! git -c http.extraHeader= fetch --quiet --no-tags --unshallow \
              origin "$CORELM_CHECKOUT_SHA" 2>/dev/null; then
              echo 'checked-out commit history fetch failed closed' >&2
              exit 1
            fi
          fi
          if test -f "$(git rev-parse --git-path shallow)"; then
            echo 'repository remained shallow after history fetch' >&2
            exit 1
          fi
          if ! git -c http.extraHeader= fetch --quiet --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' 2>/dev/null; then
            echo 'public branch fetch failed closed' >&2
            exit 1
          fi
          if ! git -c http.extraHeader= fetch --quiet --tags --force origin \
            2>/dev/null; then
            echo 'public tag fetch failed closed' >&2
            exit 1
          fi

      - name: Scan before executing repository-controlled tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B security/scan_repository_secrets.py

      - name: Test the scanner
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B -m unittest discover \
            -s security/tests -p 'test*.py' -v

      - name: Re-scan after tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B security/scan_repository_secrets.py
